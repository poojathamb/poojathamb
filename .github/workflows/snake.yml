# .github/workflows/snake.yml
name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate pink-themed snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: poojathamb
          outputs: |
            outputs: |
                      dist/pink-snake.svg?color_snake=FF69B4&color_dots=F8BBD0,F8BBD0,EF93C4,EF93C4,FF69B4
                      dist/pink-snake-dark.svg?palette=github-dark&color_snake=FF69B4&color_dots=F8BBD0,F8BBD0,EF93C4,EF93C4,FF69B4

      - name: Push generated files to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
